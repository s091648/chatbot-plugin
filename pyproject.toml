[project]
name = "chatbot-plugin"
version = "1.2.0"
description = "OpenAI-compatible RAG chat backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "chatbot-plugin-sdk",
    "fastembed>=0.3",
    "anthropic",
    "google-genai>=1.0",
    "httpx",
    "tenacity",
    "python-logging-loki>=0.3",
    # Listed explicitly here on purpose, not left to arrive transitively —
    # chatbot-plugin-sdk only depends on opentelemetry-api itself as an
    # *optional* `otel` extra (GeminiDenseProvider/RetrieveProcessor fall
    # back to a no-op tracer when it's absent), so this app must keep
    # declaring the full otel stack itself for its own setup_tracing()
    # (observability.py) and FastAPI/SQLAlchemy/httpx instrumentation to
    # keep working. Do not remove these under the assumption the SDK
    # provides them — see specs/integration.md's "SDK Dependency" section.
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-httpx",
]

[tool.uv.sources]
chatbot-plugin-sdk = { git = "https://github.com/s091648/chatbot-plugin-sdk.git", tag = "v1.2.1" }

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_plugin"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
